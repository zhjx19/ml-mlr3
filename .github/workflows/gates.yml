name: gates

# 三道门禁：
#   1) R 骨架回归 —— 全量 20 例实跑（scripts/verify_examples.R）
#   2) 幻觉键体检 —— 文档示例与 skilled 回放里出现的每个字典键都必须真实存在（scripts/check_answer_api.R）
#   3) 断言引擎自检 —— 无/有 skill 两侧的评测断言不能互相漏检（scripts/run_evals.mjs --selftest）
# 依赖清单不再手抄：由 scripts/list_example_deps.R 从 verify_examples.R 本身算出（字典键 $packages
# + 正文 pkg:: + library()），被 requireNamespace() 守卫的记为可选、缺失只 SKIP。
# 为什么：首版门禁手抄的清单漏了 `future`（骨架用例 18 里有 `future::availableCores()`，而它只是
# mlr3tuning 的 Suggests，装 mlr3verse 不带），结果本机 20/20、CI 双平台全红。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-examples:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install example deps (derived from the examples themselves)
        shell: bash
        run: |
          # 同一条纪律用在门禁自己身上：这一步过去是裸 Rscript，R 会话死在 install_logged 之前
          # （2026-09-26 实测：object 'bundled' not found，因为常量定义在调用点之后）时，
          # 公开通道一个字都读不到——脚本自带的 ::error:: 根本没来得及打印，只剩一个状态灯。
          # 所以：落盘 + 回显 + 「没跑到 deps 回执 = 中途死掉」的兜底 annotation。
          set +o pipefail
          if Rscript scripts/list_example_deps.R --install --src scripts/verify_examples.R > _deps.log 2>&1; then rc=0; else rc=$?; fi
          cat _deps.log
          # 注意不要再 grep 一遍 ^:: 的行：cat 已经把注解送进步骤输出，重复输出只会刷出重复公告
          if [ "$rc" -ne 0 ] && ! grep -q "::notice::deps " _deps.log; then
            echo "::error::依赖步骤未跑到回执（rc=$rc）= R 会话中途死掉，以下为日志尾部"
            tail -12 _deps.log | sed 's/^/::error::/'
          fi
          exit $rc

      - name: Run skeleton regression (20 cases)
        shell: bash
        run: |
          # 红灯必须自带病因：CI 日志下载要仓库权限（/logs 返回 403 Must have admin rights），
          # 公开通道只有 check-run 的 annotations。所以 FAIL 行与"死在汇总之前"的日志尾部
          # 都必须写成 ::error::，否则红灯只说"红"，不说哪一例、为什么。
          # 上一版的教训：GitHub 的 bash 默认 set -eo pipefail，`Rscript … | tee` 里 Rscript 非 0
          # 会当场中断本步骤，后面的 grep 一行都跑不到——病因就是这么被静默丢掉的。
          # 这一版干脆不用管道：直接重定向到文件，退出码就是 R 的退出码，再 cat 回步骤日志。
          set +o pipefail
          if Rscript scripts/verify_examples.R > _verify.log 2>&1; then rc=0; else rc=$?; fi
          cat _verify.log
          # 健康卡：汇总行 + 耗时行写成 notice，绿灯时也能从公开通道看到"这 20 例真的跑了多少秒"，
          # 不用下载日志（annotation 是 /logs 403 之后唯一对公众开放的通道）。
          grep -E "^=== 汇总|^--- 耗时" _verify.log | head -2 | sed 's/^/::notice::/'
          grep -F "FAIL: " _verify.log | head -4 | sed 's/^/::error::/'
          grep -F "[SKIP]" _verify.log | head -3 | sed 's/^/::warning::/'
          if [ "$rc" != "0" ] && ! grep -qF "汇总：" _verify.log; then
            # 没跑到汇总行 = R 会话中途死掉（依赖缺失 / 会话崩溃），日志尾部就是病因
            echo "::error::R 会话未跑到汇总行（rc=$rc），以下为日志尾部"
            tail -8 _verify.log | sed 's/^/::error::/'
          fi
          exit $rc

      - name: Hallucinated-key audit over every documented example (0 allowed)
        shell: bash
        run: |
          set +o pipefail
          if Rscript scripts/check_answer_api.R SKILL.md "references/*.md" "references/feature-engineering/*.md" "evals/outputs/eval-*.md" "examples/replay/skilled-*.md" > _apicheck.log 2>&1; then rc=0; else rc=$?; fi
          cat _apicheck.log
          grep -F "[幻觉]" _apicheck.log | head -10 | sed 's/^/::error::/'
          exit $rc

      - name: On failure, dump session info for triage
        if: failure()
        shell: Rscript {0}
        run: |
          cat("::warning::骨架回归未通过，以下为环境快照\n")
          print(sessionInfo())

  evals-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Assert-engine selftest (golden 0 FAIL / violations all caught)
        run: node scripts/run_evals.mjs --selftest
